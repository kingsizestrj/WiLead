<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="pragma" content="no-cache">
  <title>Wi-Fi</title>
</head>
<body>
  <!-- Endereço do portal WiLead -->
  $(if error)
  <script>var err = "$(error)";</script>
  $(else)
  <script>var err = "";</script>
  $(endif)
  <script>
    var params = new URLSearchParams({
      mac: "$(mac)",
      ip: "$(ip)",
      server: "$(server-name)",
      login: "$(link-login-only)",
      dst: "$(link-orig)",
      error: err
    });
    window.location.replace("https://wifi.voltecautomacao.com.br/p?" + params.toString());
  </script>
  <noscript><a href="https://wifi.voltecautomacao.com.br/p?mac=$(mac-esc)&ip=$(ip)&server=$(server-name)&login=$(link-login-only-esc)&dst=$(link-orig-esc)">Clique para conectar</a></noscript>
</body>
</html>
